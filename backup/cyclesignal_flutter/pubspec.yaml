name: cyclesignal
description: "CycleSignal AI — private, voice-first PCOS/PMDD evidence preparation."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State
  provider: ^6.1.2

  # Networking / live AI integrations (raw HTTP + WebSocket)
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # Voice (Hume EVI 3): mic capture + audio playback + permissions
  record: ^7.0.0
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1

  # Local-only storage (privacy-first; no server)
  shared_preferences: ^2.3.2

  # GP evidence pack (client-side PDF)
  pdf: ^3.11.1
  printing: ^5.13.3

  # Type + utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
