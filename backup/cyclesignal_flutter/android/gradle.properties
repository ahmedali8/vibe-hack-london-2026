# Capped for low-RAM machine (~5-6Gi free): the previous 8G heap + 4G metaspace
# let a single JVM request ~12.5G and froze the laptop via swap thrash.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Keep peak memory bounded: limit parallel workers, no parallel module builds.
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.configureondemand=true
# Cap the separate Kotlin compiler daemon JVM as well.
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
